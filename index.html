<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="https://kit.fontawesome.com/2820820f6e.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <title>Landing Page</title>
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <div class="leftSide brand">
        <h1 class="logo">Bank<span class="accent">Portal</span></h1>
      </div>

      <div id="rightSide" class="rightSide">
        <a href="index.html">Home</a>
        <a href="">About</a>
        <a href="mailto:lpanahon06@gmail.com">Contact</a>
        <div class="profile" title="Profile">
          <i class="fa-solid fa-user"></i>
          <label id="user">profile</label>
        </div>
        <p id="logout" class="logout">Logout</p>
      </div>

      <button id="menuIcon" class="menu-btn" aria-label="menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
    </nav>
  </header>

    <main class="container main">
      <section class="hero">
        <div class="hero-card">
          <div class="hero-left">
            <h2 class="card-title">Account Balance</h2>
            <p class="balance">PHP <span id="accountBalance">0.00</span></p>
            <div class="bankBtn">
              
            </div>
          </div>
          <div class="hero-right">
            <div class="quick-actions">
              <div id="depositBtn" class="action">
                <i class="fa-solid fa-arrow-down-long"></i>
                <small>Deposit</small>
              </div>
              <div id="withdrawBtn" class="action">
                <i class="fa-solid fa-arrow-up-long"></i>
                <small>Withdraw</small>
              </div>
            </div>
          </div>
        </div>
      </section>

   <div id="Deposit" class="overlay" style="display: none;">
        <div class="dialog depositBody">
            <div class="depositwHead">
                <h2>DEPOSIT</h2>
            </div>
            <div class="depositInputBody">

                <input type="number" id="depositinput" placeholder=" ">
                <label for="depositinput">Enter Amount</label>
            </div>
            <div id="notifDeposit" style="display: none;">
                <p id="message"></p>
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <div class="buttonDeposit">
                <button onclick="confirmDeposit()" class="btn primary">Submit</button>
                <button onclick="hideDeposit()" class="btn outline">Cancel</button>
            </div>
        </div>



    </div>

    <div id="Withdraw" class="overlay" style="display: none;">
        <div class="dialog withdrawBody">
            <div class="withdrawHead">
                <h2>WITHDRAW</h2>
            </div>
            <div class="withdrawInputBody">
                <input type="number" id="withdrawinput" placeholder=" " required>
                <label for="withdrawinput">Enter Amount</label>
            </div>
            <div id="notifWithdraw" style="display: none;">
                <p id="message1"></p>
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div class="buttonWithdraw">
                <button onclick="confirmWithdraw()" class="btn primary">Submit</button>
                <button onclick="hideWithdraw()" class="btn outline">Cancel</button>
            </div>
        </div>
    </div>


    <div id="modalBody" style="display: none;">
        <div class="dialog modalcontent">
            <h2>Are You Sure?</h2>
            <div class="modalBtn">
                <button onclick="logout()" type="button" class="btn primary">YES</button>
                <button onclick="cancelLogout()" type="button" class="btn outline">NO</button>
            </div>
        </div>
    </div>

    <section class="history">
      <div class="transaction-card">
        <div id="transactionHistory" class="transactionHeader">
          <div class="transactionHistoryHead">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <h2>Transaction History</h2>
          </div>
        </div>

        <div class="table-wrap">
          <table id="transactionTable" class="table">
            <thead>
              <tr>
                <th>UserID</th>
                <th>User</th>
                <th>Transaction</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="transactionValue">
              <!-- Transactions populated here -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>


    <div id="loadingBody" style="display: none;">
        <div id="loading"></div>
    </div>

    <script defer src="landingPage.js"></script>
</body>

</html>
