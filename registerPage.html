<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/2820820f6e.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="registerPage.css">
    <title>BankApp | Sign Up</title>
</head>

<body>

    <!-- Standardized Notification Bar -->
    <div id="notification" class="notif-bar" style="display: none;">
        <span id="message"></span>
        <div id="loader" class="mini-spinner"></div>
    </div>

    <div class="register-wrapper">
        <div class="register-card">
            <div class="register-header">
                <div class="logo-circle">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p>Join BankApp and manage your finances with ease.</p>
                <button type="button" onclick="goto()" class="close-btn" title="Back to Login">&times;</button>
            </div>

            <form id="registerForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmpassword">Confirm Password</label>
                    <div class="input-field">
                        <i class="fa-solid fa-shield-check"></i>
                        <input type="password" id="confirmpassword" placeholder="Repeat your password" required>
                    </div>
                </div>

                <div class="register-actions">
                    <button type="submit" class="btn-submit">Register Now</button>
                </div>
            </form>

            <div class="register-footer">
                <p id="goto">Already have an account? <span>Sign In</span></p>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingBody" class="loader-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Preparing your account...</p>
    </div>

    <script defer src="registerPage.js"></script>
</body>

</html>
